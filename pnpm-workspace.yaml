packages:
  - packages/*
  - apps/*

# pnpm 11: packages allowed to run install scripts (everything else is denied).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  bufferutil: false
  utf-8-validate: false
  bigint-buffer: false
  protobufjs: false
